<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>受験情報ポータル</title>
  <meta name="description" content="受験に役立つコラムと、先輩たちの受験体験記をまとめたポータルサイトです。">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --blue: #1769d2;
      --blue-dark: #0d47a1;
      --blue-light: #eaf3ff;
      --text: #18324f;
      --muted: #64748b;
      --white: #ffffff;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Hiragino Sans",
        "Yu Gothic", YuGothic, Meiryo, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgba(86, 157, 255, 0.20), transparent 28%),
        radial-gradient(circle at 85% 25%, rgba(42, 116, 220, 0.14), transparent 30%),
        linear-gradient(135deg, #f7fbff 0%, #edf5ff 48%, #ffffff 100%);
      overflow-x: hidden;
    }

    /* ===== Header ===== */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 20;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(23, 105, 210, 0.08);
    }

    .logo {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--blue-dark);
    }

    .header-link {
      color: var(--blue);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    /* ===== Hero ===== */
    .hero {
      min-height: 100vh;
      padding: 150px 6% 90px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .hero-inner {
      width: min(1050px, 100%);
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 15px;
      border-radius: 999px;
      background: rgba(23, 105, 210, 0.09);
      color: var(--blue);
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 22px;
    }

    .eyebrow::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--blue);
    }

    h1 {
      font-size: clamp(42px, 7vw, 78px);
      line-height: 1.08;
      letter-spacing: -0.04em;
      color: #12345a;
      margin-bottom: 24px;
    }

    .hero-copy {
      max-width: 650px;
      margin: 0 auto;
      color: var(--muted);
      line-height: 1.9;
      font-size: clamp(15px, 2vw, 18px);
    }

    .scroll-hint {
      margin-top: 46px;
      color: #7890aa;
      font-size: 12px;
      letter-spacing: 0.15em;
    }

    .scroll-hint span {
      display: block;
      width: 1px;
      height: 42px;
      background: #9ab5d4;
      margin: 12px auto 0;
    }

    /* ===== Cards ===== */
    .contents {
      width: min(1050px, 88%);
      margin: 0 auto;
      padding: 30px 0 120px;
    }

    .section-title {
      text-align: center;
      margin-bottom: 42px;
    }

    .section-title small {
      display: block;
      color: var(--blue);
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.12em;
      margin-bottom: 10px;
    }

    .section-title h2 {
      font-size: clamp(28px, 4vw, 42px);
      color: #163b63;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 28px;
    }

    .card {
      position: relative;
      min-height: 330px;
      padding: 42px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(23, 105, 210, 0.12);
      box-shadow: 0 18px 50px rgba(31, 83, 139, 0.10);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card::before {
      content: "";
      position: absolute;
      width: 170px;
      height: 170px;
      right: -70px;
      top: -70px;
      border-radius: 50%;
      background: var(--blue-light);
    }

    .card:hover {
      transform: translateY(-7px);
      box-shadow: 0 25px 65px rgba(31, 83, 139, 0.16);
    }

    .icon {
      position: relative;
      z-index: 1;
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: linear-gradient(145deg, #e8f2ff, #d9eaff);
      font-size: 29px;
      margin-bottom: 25px;
    }

    .card h3 {
      font-size: 29px;
      color: #164d89;
      margin-bottom: 13px;
    }

    .card p {
      color: var(--muted);
      line-height: 1.8;
      font-size: 15px;
      max-width: 420px;
    }

    .button {
      position: relative;
      z-index: 2;
      margin-top: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: fit-content;
      min-width: 190px;
      padding: 15px 24px;
      border-radius: 999px;
      background: linear-gradient(135deg, #2380e8, #0d57b7);
      color: white;
      text-decoration: none;
      font-weight: 800;
      font-size: 15px;
      box-shadow: 0 10px 25px rgba(23, 105, 210, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(23, 105, 210, 0.32);
    }

    .button::after {
      content: "→";
      font-size: 18px;
      transition: transform 0.2s ease;
    }

    .button:hover::after {
      transform: translateX(4px);
    }

    /* ===== Footer ===== */
    footer {
      padding: 35px 6%;
      text-align: center;
      background: #0d3768;
      color: rgba(255,255,255,0.75);
      font-size: 12px;
    }

    /* ===== Responsive ===== */
    @media (max-width: 760px) {
      header {
        padding: 15px 5%;
      }

      .header-link {
        display: none;
      }

      .hero {
        min-height: 88vh;
        padding: 120px 7% 60px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .card {
        min-height: 300px;
        padding: 32px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">受験情報ポータル</div>
    <a href="#contents" class="header-link">CONTENTS ↓</a>
  </header>

  <main>
    <section class="hero">
      <div class="hero-inner">
        <div class="eyebrow">EXAM INFORMATION PORTAL</div>

        <h1>受験に役立つ情報を、<br>ここから。</h1>

        <p class="hero-copy">
          勉強法や受験に役立つコラムと、<br>
          先輩たちのリアルな受験体験記をまとめています。
        </p>

        <div class="scroll-hint">
          SCROLL TO EXPLORE
          <span></span>
        </div>
      </div>
    </section>

    <section class="contents" id="contents">
      <div class="section-title">
        <small>CONTENTS</small>
        <h2>知りたい情報を選ぶ</h2>
      </div>

      <div class="cards">

        <!-- コラム -->
        <article class="card">
          <div>
            <div class="icon">📝</div>
            <h3>コラム</h3>
            <p>
              勉強法や受験準備など、受験に役立つ情報をまとめています。
              気になるテーマからチェックしてみてください。
            </p>
          </div>

          <a
            class="button"
            href="https://green-radium-99e.notion.site/33f06cebba0180d19b5ec3e684bb0b3b"
            target="_blank"
            rel="noopener noreferrer"
          >
            コラムを見る
          </a>
        </article>

        <!-- 受験体験記 -->
        <article class="card">
          <div>
            <div class="icon">🎓</div>
            <h3>受験体験記</h3>
            <p>
              実際に受験を経験した先輩たちの体験記を読むことができます。
              受験生活や勉強の参考にしてください。
            </p>
          </div>

          <a
            class="button"
            href="https://green-radium-99e.notion.site/33106cebba018027965bf563a75de9f2?v=33106cebba0180a4b02f000c1fd9a126"
            target="_blank"
            rel="noopener noreferrer"
          >
            受験体験記を見る
          </a>
        </article>

      </div>
    </section>
  </main>

  <footer>
    © 2026 受験情報ポータル
  </footer>

</body>
</html>
